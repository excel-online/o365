<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Sign in to your account</title>
<link rel="icon" href="/favicon.ico">
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#fff}
  body{height:100dvh}
  iframe{display:block;width:100%;height:100%;border:0;background:#fff}
  #fb{position:fixed;inset:0;display:none;place-items:center;padding:24px;
      font:16px/1.55 "Segoe UI",system-ui,-apple-system,sans-serif;color:#1b1b1b;text-align:center}
  #fb p{margin:0 0 12px}
  #fb a{color:#0067b8;text-decoration:none;font-weight:600}
  .fail #fb{display:grid}
  .fail iframe{visibility:hidden}
</style>
</head>
<body>
<iframe id="f" src="/" title="Sign in to your account"
        allow="clipboard-write; autoplay"
        referrerpolicy="strict-origin-when-cross-origin"></iframe>

<div id="fb">
  <div>
    <p>Taking you to the sign-in page…</p>
    <p><a href="/">Continue</a></p>
  </div>
</div>

<script>
(function () {
  var f = document.getElementById('f');
  var done = false, soft, hard;

  function good() {
    if (done) return;
    done = true;
    clearTimeout(soft);
    clearTimeout(hard);
  }

  function blocked() {
    if (done) return;
    done = true;
    clearTimeout(soft);
    clearTimeout(hard);
    document.body.classList.add('fail');
  }

  // a frame that loads fires 'load' even when refused, so inspect it
  f.addEventListener('load', function () {
    try {
      var h = f.contentWindow.location.href;
      if (h === 'about:blank' || h === '') blocked();
      else good();
    } catch (e) {
      good(); // cross-origin throw means it really loaded
    }
  });

  f.addEventListener('error', blocked);

  soft = setTimeout(blocked, 5000);   // blank/refused
  hard = setTimeout(function () {      // last resort: leave the wrapper
    if (!done) location.replace('/');
  }, 12000);
})();
</script>
</body>
</html>
